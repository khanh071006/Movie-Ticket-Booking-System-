spring.application.name=Movie_Ticket_Booking_System
spring.datasource.initialize=false

# ===============================
# C?U HÌNH K?T N?I DATABASE POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/movie_booking_db
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# C?U HÌNH HIBERNATE / JPA
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gi? nguyên c?u hình này ?? Spring Boot không t? ý ??ng vào Database
spring.jpa.hibernate.ddl-auto=none

#l?y m?t kh?u databaselocal
spring.profiles.active=local