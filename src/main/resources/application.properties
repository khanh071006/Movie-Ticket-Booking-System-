spring.application.name=Movie_Ticket_Booking_System
spring.datasource.initialize=false

# ===============================
# CONFIG POSTGRESQL DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/movie_booking_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
# Hãy thay đổi mật khẩu bên dưới cho đúng với cấu hình PostgreSQL trên máy của bạn
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONFIG HIBERNATE / JPA
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.session.store-type=none

# ===============================
# SECURITY JWT CONFIG
# ===============================
jwt.secret=9a72635c6e8346e29a672348a8bcfd7612345678901234567890123456789012
jwt.expiration=86400
jwt.expires-in=86400

logging.level.org.springframework.security=DEBUG